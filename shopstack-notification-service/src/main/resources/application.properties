server.port=8083

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/shopstack_notification_service
spring.datasource.username=root
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.swagger-ui.tagsSorter=alpha

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.shopstack.kafka.events

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Required: no defaults. Startup fails with "Could not resolve placeholder 'MAIL_USERNAME'"
# (or 'MAIL_PASSWORD') when the environment variables are missing.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
