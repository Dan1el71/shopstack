global:
  scrape_interval: 15s

scrape_configs:
  - job_name: shopstack-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shopstack-server:8081"]

  - job_name: shopstack-payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8082"]

  - job_name: shopstack-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]
