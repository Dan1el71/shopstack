name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test
        run: mvn -B test -Dit.skip=true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testcontainers suite
        run: mvn -B -pl shopstack-it -am test

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopstack-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shopstack-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
        env:
          CI: "true"

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - shopstack-server
          - shopstack-payment-service
          - shopstack-notification-service
          - shopstack-ui
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t shopstack/${{ matrix.service }}:ci ${{ matrix.service }}
